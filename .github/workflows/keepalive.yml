name: Keep Render awake

# Render 무료 플랜은 15분 동안 요청이 없으면 잠들고, 깨어나는 데 약 1분이 걸린다.
# 10분마다 /healthz를 호출해서 Claude가 처음 질문할 때 지연·타임아웃이 나지 않게 한다.
# 설정: 저장소 Settings → Secrets and variables → Actions → Variables 탭 → RENDER_URL
#       (예: https://lexguard-mcp-xxxx.onrender.com  — 비밀 경로는 넣지 않음)

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping /healthz
        env:
          RENDER_URL: ${{ vars.RENDER_URL }}
        run: |
          # 복사·붙여넣기로 섞여 들어간 공백, 줄바꿈, 앞쪽 기호 등을 걸러내고 https://호스트 부분만 사용
          BASE=$(printf '%s' "$RENDER_URL" | tr -d '\r\n\t ' | grep -oE 'https?://[A-Za-z0-9.-]+' | head -n1 || true)
          if [ -z "$BASE" ]; then
            echo "::error::RENDER_URL 변수가 비었거나 형식이 올바르지 않습니다. 예: https://lexguard-mcp-xxxx.onrender.com"
            exit 1
          fi
          echo "대상: $BASE/healthz"
          curl -fsS --retry 3 --retry-delay 20 --retry-all-errors --max-time 90 "$BASE/healthz"
