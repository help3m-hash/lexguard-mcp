name: Keep Render awake

# Render 무료 플랜은 15분 동안 요청이 없으면 잠들고, 깨어나는 데 약 1분이 걸린다.
# 10분마다 /healthz를 호출해서 Claude가 처음 질문할 때 지연·타임아웃이 나지 않게 한다.
# 설정: 저장소 Settings → Secrets and variables → Actions → Variables 탭 → RENDER_URL
#       (예: https://lexguard-mcp-xxxx.onrender.com  — 비밀 경로는 넣지 않음)

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping /healthz
        env:
          RENDER_URL: ${{ vars.RENDER_URL }}
        run: |
          if [ -z "$RENDER_URL" ]; then
            echo "RENDER_URL 변수가 아직 없습니다. 설정 후 동작합니다."
            exit 0
          fi
          curl -fsS --retry 3 --retry-delay 20 --max-time 90 "${RENDER_URL%/}/healthz"
